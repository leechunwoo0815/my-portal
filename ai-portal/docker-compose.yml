version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-portal-backend
    env_file: ./backend/.env
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    restart: unless-stopped
    networks:
      - ai-portal

  frontend:
    build: ./frontend
    container_name: ai-portal-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-portal

volumes:
  backend-data:
  backend-logs:

networks:
  ai-portal:
    driver: bridge
